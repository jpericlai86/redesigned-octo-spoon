<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>東京旅程 & 智能記帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'jp-bg': '#F9F9F4', // 米白
                        'jp-card': '#FFFDF9', // 亮白
                        'jp-accent': '#E8DMB5', // 淡黃
                        'jp-text': '#4A4A4A', // 深灰
                        'jp-sub': '#8C8C8C', // 淺灰
                        'jp-yellow': '#F4E06D', // 重點黃
                        'jp-green': '#A6B98F',
                        'jp-red': '#D68C8C'
                    },
                    fontFamily: {
                        sans: ['Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F9F9F4; color: #4A4A4A; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .nav-active { color: #D4AF37; font-weight: bold; }
        input, select, textarea { 
            border: 1px solid #E5E5E5; 
            border-radius: 12px; 
            padding: 12px; 
            width: 100%; 
            background: #FFF;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: #F4E06D; }
        .card-shadow { box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
    </style>
</head>
<body class="pb-24">

    <div class="fixed top-0 w-full bg-jp-bg z-50 px-6 py-4 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold tracking-widest text-jp-text">TOKYO <span class="text-xs font-normal ml-1">TRIP</span></h1>
        <div class="flex items-center gap-2 bg-white px-3 py-1 rounded-full shadow-sm border border-gray-100">
            <span class="text-xs text-jp-sub">匯率</span>
            <input type="number" id="exchangeRate" value="0.053" step="0.001" class="w-16 text-right border-none p-0 text-sm font-bold bg-transparent focus:ring-0">
        </div>
    </div>

    <div class="mt-20 px-4" id="mainContainer">
        
        <div id="itinerarySection">
            <div class="flex overflow-x-auto gap-3 pb-4 hide-scrollbar" id="dateScroller">
                </div>

            <button onclick="toggleModal('planModal')" class="w-full bg-jp-text text-white py-3 rounded-xl shadow-lg mb-6 flex items-center justify-center gap-2 transform active:scale-95 transition">
                <i class="fas fa-plus"></i> 新增行程
            </button>

            <div id="planList" class="space-y-4">
                <div class="text-center text-jp-sub py-10 opacity-50">暫無行程，請按上方按鈕新增</div>
            </div>
        </div>

        <div id="walletSection" class="hidden">
            
            <button onclick="toggleModal('expenseModal')" class="w-full bg-jp-yellow text-jp-text font-bold py-3 rounded-xl shadow-lg mb-6 flex items-center justify-center gap-2 transform active:scale-95 transition">
                <i class="fas fa-receipt"></i> 記一筆 (日元)
            </button>

            <div class="bg-white p-5 rounded-2xl card-shadow mb-6">
                <h2 class="font-bold text-lg mb-4 flex items-center gap-2"><i class="fas fa-chart-pie text-jp-yellow"></i> 消費總結 (HKD)</h2>
                
                <div class="flex items-center justify-between mb-6">
                    <div class="w-1/2">
                        <canvas id="userChart"></canvas>
                    </div>
                    <div class="w-1/2 pl-4 text-sm">
                        <div class="flex justify-between mb-1"><span class="text-blue-500">Eric</span> <span id="ericTotalDisp" class="font-bold">0</span></div>
                        <div class="flex justify-between mb-1"><span class="text-pink-500">Clement</span> <span id="clementTotalDisp" class="font-bold">0</span></div>
                        <div class="border-t my-2"></div>
                        <div class="flex justify-between"><span class="text-jp-sub">Total</span> <span id="grandTotalDisp" class="font-bold">0</span></div>
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl card-shadow mb-6">
                <h2 class="font-bold text-lg mb-2 flex items-center gap-2"><i class="fas fa-credit-card text-jp-green"></i> 信用卡回贈分析</h2>
                <p class="text-xs text-jp-sub mb-4">圖表顯示簽帳進度：<br>
                <span class="inline-block w-2 h-2 rounded-full bg-gray-300 mr-1"></span>未達標 
                <span class="inline-block w-2 h-2 rounded-full bg-green-400 mr-1 ml-2"></span>合資格 
                <span class="inline-block w-2 h-2 rounded-full bg-red-400 mr-1 ml-2"></span>超出上限</p>
                
                <div id="cardsContainer" class="grid grid-cols-1 gap-6">
                    </div>

                <div class="mt-6 bg-jp-bg p-4 rounded-xl border border-dashed border-gray-300">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-gray-600">預計總現金回贈</span>
                        <span class="text-xl font-bold text-green-600">HKD <span id="totalRebateDisp">0</span></span>
                    </div>
                </div>
            </div>

            <div class="space-y-4" id="ledgerList">
                <h3 class="font-bold text-gray-500 ml-1">每日明細</h3>
                </div>
            
            <button onclick="resetData()" class="w-full mt-8 border border-red-200 text-red-400 py-3 rounded-xl text-sm mb-10">
                <i class="fas fa-trash"></i> 重置所有資料
            </button>
        </div>
    </div>

    <div class="fixed bottom-0 w-full bg-white border-t border-gray-100 flex justify-around py-3 pb-6 z-50 shadow-[0_-5px_10px_rgba(0,0,0,0.02)]">
        <button onclick="switchTab('itinerary')" id="btnItinerary" class="flex flex-col items-center text-jp-text nav-active transition">
            <i class="fas fa-map-marked-alt text-xl mb-1"></i>
            <span class="text-xs">行程</span>
        </button>
        <button onclick="switchTab('wallet')" id="btnWallet" class="flex flex-col items-center text-jp-sub transition">
            <i class="fas fa-wallet text-xl mb-1"></i>
            <span class="text-xs">記帳</span>
        </button>
    </div>

    <div id="planModal" class="hidden fixed inset-0 bg-black bg-opacity-30 z-[60] flex items-end sm:items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-full sm:w-96 rounded-t-2xl sm:rounded-2xl p-6 shadow-2xl slide-up-anim">
            <h3 class="font-bold text-lg mb-4">新增行程</h3>
            <div class="space-y-3">
                <input type="date" id="planDate">
                <input type="time" id="planTime">
                <input type="text" id="planLoc" placeholder="地點 (Google Map 搜尋關鍵字)">
                <input type="text" id="planActivity" placeholder="活動內容">
                <textarea id="planNote" placeholder="備註 (巴士/火車時間)" rows="2"></textarea>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="toggleModal('planModal')" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-500">取消</button>
                <button onclick="addPlan()" class="flex-1 py-3 rounded-xl bg-jp-text text-white font-bold">儲存</button>
            </div>
        </div>
    </div>

    <div id="expenseModal" class="hidden fixed inset-0 bg-black bg-opacity-30 z-[60] flex items-end sm:items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-full sm:w-96 rounded-t-2xl sm:rounded-2xl p-6 shadow-2xl slide-up-anim">
            <h3 class="font-bold text-lg mb-4">新增消費 (JPY)</h3>
            <div class="space-y-3">
                <div class="flex gap-2">
                    <button onclick="setExpenseUser('Eric')" id="btnExpEric" class="flex-1 py-2 rounded-lg border border-blue-200 bg-blue-50 text-blue-600 font-bold transition">Eric</button>
                    <button onclick="setExpenseUser('Clement')" id="btnExpClement" class="flex-1 py-2 rounded-lg border border-gray-200 text-gray-400 transition">Clement</button>
                </div>
                <input type="date" id="expDate">
                <input type="number" id="expAmount" placeholder="金額 (JPY)" inputmode="numeric">
                <input type="text" id="expItem" placeholder="項目 (例如: 晚餐)">
                <select id="expCard">
                    </select>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="toggleModal('expenseModal')" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-500">取消</button>
                <button onclick="addExpense()" class="flex-1 py-3 rounded-xl bg-jp-yellow text-jp-text font-bold">記帳</button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA & CONFIG ---
        let currentTab = 'itinerary';
        let expenseUser = 'Eric';
        
        // 信用卡規則設定
        const cardRules = {
            "Eric's MM power": { min: 5000, max: 8929, rate: 0.06 },
            "Clement's MM power": { min: 5000, max: 8929, rate: 0.06 },
            "恒生Travel+": { min: 6000, max: 7576, rate: 0.07 },
            "Sim card": { min: 1000, max: 2500, rate: 0.08 },
            "中銀chill": { min: 0, max: 3260, rate: 0.05 },
            "中銀cheers": { min: 5000, max: 25000, rate: 0.04 },
            "建行travo": { min: 0, max: 44444, rate: 0.04 }
        };

        // Initialize Data
        let plans = JSON.parse(localStorage.getItem('tokyo_plans')) || [];
        let expenses = JSON.parse(localStorage.getItem('tokyo_expenses')) || [];

        // --- DOM ELEMENTS & INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            initDateScroller();
            renderPlans();
            renderCardOptions();
            
            // Set default date to today for inputs
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('planDate').value = today;
            document.getElementById('expDate').value = today;
            
            // Initialize User Chart
            initCharts();
            updateWalletUI();
        });

        // --- NAVIGATION ---
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('itinerarySection').classList.toggle('hidden', tab !== 'itinerary');
            document.getElementById('walletSection').classList.toggle('hidden', tab !== 'wallet');
            
            const btnItinerary = document.getElementById('btnItinerary');
            const btnWallet = document.getElementById('btnWallet');

            if(tab === 'itinerary') {
                btnItinerary.className = 'flex flex-col items-center text-jp-text nav-active transition';
                btnItinerary.querySelector('i').classList.remove('text-jp-sub');
                btnWallet.className = 'flex flex-col items-center text-jp-sub transition';
            } else {
                btnWallet.className = 'flex flex-col items-center text-jp-text nav-active transition';
                btnItinerary.className = 'flex flex-col items-center text-jp-sub transition';
                updateWalletUI(); // Refresh charts when entering wallet
            }
        }

        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.classList.toggle('hidden');
        }

        // --- ITINERARY LOGIC ---
        function initDateScroller() {
            const scroller = document.getElementById('dateScroller');
            scroller.innerHTML = '';
            // Generate next 14 days for simplicity
            const today = new Date();
            for (let i = 0; i < 14; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const dayStr = d.getDate();
                const weekStr = ['日','一','二','三','四','五','六'][d.getDay()];
                const fullDate = d.toISOString().split('T')[0];

                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 w-14 h-16 rounded-xl flex flex-col items-center justify-center border transition ${i === 0 ? 'bg-jp-text text-white border-jp-text' : 'bg-white text-gray-400 border-gray-100'}`;
                btn.innerHTML = `<span class="text-xs">${weekStr}</span><span class="text-lg font-bold">${dayStr}</span>`;
                btn.onclick = () => filterPlanByDate(fullDate, btn);
                scroller.appendChild(btn);
            }
        }

        function addPlan() {
            const date = document.getElementById('planDate').value;
            const time = document.getElementById('planTime').value;
            const loc = document.getElementById('planLoc').value;
            const activity = document.getElementById('planActivity').value;
            const note = document.getElementById('planNote').value;

            if (!date || !activity) return alert('請填寫日期及活動');

            plans.push({ id: Date.now(), date, time, loc, activity, note });
            plans.sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time));
            localStorage.setItem('tokyo_plans', JSON.stringify(plans));
            
            renderPlans();
            toggleModal('planModal');
            // Clear inputs
            document.getElementById('planLoc').value = '';
            document.getElementById('planActivity').value = '';
            document.getElementById('planNote').value = '';
        }

        function renderPlans(filterDate = null) {
            const list = document.getElementById('planList');
            list.innerHTML = '';
            
            let displayPlans = plans;
            if (filterDate) {
                displayPlans = plans.filter(p => p.date === filterDate);
            }

            if (displayPlans.length === 0) {
                list.innerHTML = `<div class="text-center text-jp-sub py-10 opacity-50">該日暫無行程</div>`;
                return;
            }

            displayPlans.forEach(p => {
                const mapLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.loc)}`;
                const item = document.createElement('div');
                item.className = 'bg-white p-4 rounded-xl card-shadow flex gap-4';
                item.innerHTML = `
                    <div class="flex flex-col items-center justify-center border-r pr-4 border-gray-100 min-w-[60px]">
                        <span class="text-xs text-jp-sub">${p.date.substring(5).replace('-','/')}</span>
                        <span class="font-bold text-lg">${p.time}</span>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <h4 class="font-bold text-jp-text">${p.activity}</h4>
                            <a href="${mapLink}" target="_blank" class="text-blue-400"><i class="fas fa-map-marker-alt"></i></a>
                        </div>
                        <p class="text-sm text-gray-500 mt-1"><i class="fas fa-map-pin text-xs mr-1"></i> ${p.loc}</p>
                        ${p.note ? `<div class="mt-2 bg-jp-bg p-2 rounded text-xs text-gray-600">${p.note}</div>` : ''}
                        <button onclick="deletePlan(${p.id})" class="text-xs text-red-300 mt-2">刪除</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function deletePlan(id) {
            if(confirm('確定刪除?')) {
                plans = plans.filter(p => p.id !== id);
                localStorage.setItem('tokyo_plans', JSON.stringify(plans));
                renderPlans();
            }
        }

        function filterPlanByDate(date, btnElement) {
            // Update UI styles for buttons
            const btns = document.getElementById('dateScroller').children;
            for(let b of btns) {
                b.className = 'flex-shrink-0 w-14 h-16 rounded-xl flex flex-col items-center justify-center border border-gray-100 bg-white text-gray-400 transition';
            }
            btnElement.className = 'flex-shrink-0 w-14 h-16 rounded-xl flex flex-col items-center justify-center border border-jp-text bg-jp-text text-white transition shadow-lg';
            renderPlans(date);
        }

        // --- EXPENSE LOGIC ---
        function renderCardOptions() {
            const select = document.getElementById('expCard');
            select.innerHTML = '';
            for (let card in cardRules) {
                const opt = document.createElement('option');
                opt.value = card;
                opt.innerText = card;
                select.appendChild(opt);
            }
        }

        function setExpenseUser(user) {
            expenseUser = user;
            const btnE = document.getElementById('btnExpEric');
            const btnC = document.getElementById('btnExpClement');
            if(user === 'Eric') {
                btnE.className = 'flex-1 py-2 rounded-lg border border-blue-200 bg-blue-50 text-blue-600 font-bold transition';
                btnC.className = 'flex-1 py-2 rounded-lg border border-gray-200 text-gray-400 transition';
            } else {
                btnE.className = 'flex-1 py-2 rounded-lg border border-gray-200 text-gray-400 transition';
                btnC.className = 'flex-1 py-2 rounded-lg border border-pink-200 bg-pink-50 text-pink-600 font-bold transition';
            }
        }

        function addExpense() {
            const date = document.getElementById('expDate').value;
            const amount = parseFloat(document.getElementById('expAmount').value);
            const item = document.getElementById('expItem').value;
            const card = document.getElementById('expCard').value;
            const rate = parseFloat(document.getElementById('exchangeRate').value);

            if (!amount || !item) return alert('請填寫金額及項目');

            expenses.push({ 
                id: Date.now(), 
                date, 
                user: expenseUser, 
                amountJPY: amount, 
                amountHKD: amount * rate, 
                item, 
                card 
            });
            localStorage.setItem('tokyo_expenses', JSON.stringify(expenses));
            
            toggleModal('expenseModal');
            document.getElementById('expAmount').value = '';
            document.getElementById('expItem').value = '';
            
            updateWalletUI();
        }

        function updateWalletUI() {
            const rate = parseFloat(document.getElementById('exchangeRate').value);
            
            // 1. Calculate Summaries
            let ericTotal = 0;
            let clementTotal = 0;
            let cardSpends = {}; // HKD sums per card
            
            // Init card spends to 0
            for(let c in cardRules) cardSpends[c] = 0;

            // Group expenses by date for Ledger
            const expensesByDate = {};

            expenses.forEach(e => {
                // Update HKD based on current rate setting dynamically or saved? 
                // Let's re-calc HKD based on current rate input for consistency
                const currentHKD = e.amountJPY * rate;
                
                if (e.user === 'Eric') ericTotal += currentHKD;
                else clementTotal += currentHKD;

                if (cardSpends[e.card] !== undefined) {
                    cardSpends[e.card] += currentHKD;
                }

                if (!expensesByDate[e.date]) expensesByDate[e.date] = [];
                expensesByDate[e.date].push({...e, currentHKD});
            });

            // 2. Update Charts
            updateUserChart(ericTotal, clementTotal);
            updateCardCharts(cardSpends);

            // 3. Update Text Display
            document.getElementById('ericTotalDisp').innerText = Math.round(ericTotal).toLocaleString();
            document.getElementById('clementTotalDisp').innerText = Math.round(clementTotal).toLocaleString();
            document.getElementById('grandTotalDisp').innerText = Math.round(ericTotal + clementTotal).toLocaleString();

            // 4. Render Ledger List
            renderLedger(expensesByDate);
        }

        function renderLedger(groupedExpenses) {
            const container = document.getElementById('ledgerList');
            // Keep header
            container.innerHTML = `<h3 class="font-bold text-gray-500 ml-1">每日明細</h3>`;
            
            const dates = Object.keys(groupedExpenses).sort().reverse();
            
            if (dates.length === 0) {
                 container.innerHTML += `<div class="text-center text-sm text-gray-300 py-4">暫無消費記錄</div>`;
                 return;
            }

            dates.forEach(date => {
                const dayTotalJPY = groupedExpenses[date].reduce((sum, e) => sum + e.amountJPY, 0);
                const dayTotalHKD = groupedExpenses[date].reduce((sum, e) => sum + e.currentHKD, 0);

                let html = `
                    <div class="bg-white rounded-xl card-shadow overflow-hidden">
                        <div class="bg-gray-50 px-4 py-2 flex justify-between items-center border-b border-gray-100">
                            <span class="font-bold text-gray-600">${date}</span>
                            <div class="text-xs text-right">
                                <div class="text-gray-500">¥${dayTotalJPY.toLocaleString()}</div>
                                <div class="font-bold text-gray-700">HK$${Math.round(dayTotalHKD).toLocaleString()}</div>
                            </div>
                        </div>
                        <div class="p-0">
                `;

                groupedExpenses[date].forEach(e => {
                    const userColor = e.user === 'Eric' ? 'text-blue-500' : 'text-pink-500';
                    html += `
                        <div class="flex justify-between items-center p-3 border-b border-gray-50 last:border-0">
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-bold ${userColor} border px-1 rounded border-current">${e.user[0]}</span>
                                    <span class="text-sm font-medium text-jp-text">${e.item}</span>
                                </div>
                                <div class="text-xs text-gray-400 pl-7">${e.card}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-bold">¥${e.amountJPY.toLocaleString()}</div>
                                <div class="text-xs text-gray-400">HK$${Math.round(e.currentHKD).toLocaleString()}</div>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        // --- CHART JS SETUP ---
        let userChartInstance = null;
        let cardChartInstances = {};

        function initCharts() {
            const ctx = document.getElementById('userChart').getContext('2d');
            userChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Eric', 'Clement'],
                    datasets: [{
                        data: [0, 0],
                        backgroundColor: ['#3B82F6', '#EC4899'],
                        borderWidth: 0
                    }]
                },
                options: {
                    cutout: '70%',
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateUserChart(eric, clement) {
            if(!userChartInstance) return;
            userChartInstance.data.datasets[0].data = [eric, clement];
            if (eric === 0 && clement === 0) {
                 userChartInstance.data.datasets[0].backgroundColor = ['#E5E5E5', '#E5E5E5'];
                 userChartInstance.data.datasets[0].data = [1, 0]; // dummy
            } else {
                 userChartInstance.data.datasets[0].backgroundColor = ['#3B82F6', '#EC4899'];
            }
            userChartInstance.update();
        }

        function updateCardCharts(spends) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            let totalRebate = 0;

            for (let cardName in cardRules) {
                const rule = cardRules[cardName];
                const spend = spends[cardName];
                
                // Calculate Rebate
                let rebate = 0;
                let statusColor = ''; // Logic: Gray (under min), Green (Eligible), Red (Over Cap)
                
                // Rebate Logic
                if (spend >= rule.min) {
                    if (spend <= rule.max) {
                        rebate = spend * rule.rate;
                        statusColor = '#4ADE80'; // Green
                    } else {
                        rebate = rule.max * rule.rate;
                        statusColor = '#F87171'; // Red (Overflow warning)
                    }
                } else {
                    statusColor = '#D1D5DB'; // Gray (Under min)
                }
                
                totalRebate += rebate;

                // Chart Data Logic (Visualize Spend vs Max Cap)
                // We want a ring. 
                // Segment 1: Spend (capped at Max for visual sake if we want simple gauge, OR show overflow)
                // Let's do: [Spend within Cap, Remaining Cap] if under Cap.
                // If over Cap: [Max Cap, Overflow] -> but distinct colors.
                
                let dataValues = [];
                let bgColors = [];
                
                // Visual Logic requested: 
                // 1. Under Min (Show progress to Min? Or just progress relative to Max?)
                // Let's standardize: The full circle represents the MAX CAP.
                
                let fill = spend;
                let empty = rule.max - spend;
                let overflow = 0;

                if (spend > rule.max) {
                    fill = rule.max;
                    empty = 0;
                    overflow = spend - rule.max;
                    // Visual hack: If overflow, we show full ring but color changes? 
                    // Let's do a stacked doughnut.
                    // Actually, simpler is better for "App like".
                    // Let's make the ring show "Spend" vs "Space Left".
                    // If Spend > Cap, show Red Ring.
                }

                if (empty < 0) empty = 0;

                // Color Logic
                let segmentColor = '#D1D5DB'; // Default Gray
                if (spend < rule.min) segmentColor = '#D1D5DB'; // Not qualified
                else if (spend <= rule.max) segmentColor = '#4ADE80'; // Good
                else segmentColor = '#F87171'; // Over

                // HTML Construction
                const div = document.createElement('div');
                div.className = "flex items-center gap-4 border-b border-gray-100 pb-4 last:border-0";
                
                // Mini Pie Chart Canvas ID
                const chartId = `chart-${cardName.replace(/\s/g, '')}`;
                
                div.innerHTML = `
                    <div class="relative w-16 h-16 flex-shrink-0">
                        <canvas id="${chartId}"></canvas>
                        <div class="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-gray-400">
                            ${Math.round((spend/rule.max)*100)}%
                        </div>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-center mb-1">
                            <h4 class="font-bold text-sm text-gray-700">${cardName}</h4>
                            <span class="text-xs font-bold text-green-600">+HKD ${Math.round(rebate)}</span>
                        </div>
                        <div class="text-xs text-gray-400 mb-1">
                            已簽: $${Math.round(spend).toLocaleString()} / 上限: $${rule.max.toLocaleString()}
                        </div>
                        <div class="text-[10px] text-gray-300">
                            下限: $${rule.min} | 回贈: ${(rule.rate*100)}%
                        </div>
                    </div>
                `;
                container.appendChild(div);

                // Render Chart
                const ctx = document.getElementById(chartId).getContext('2d');
                
                // Data Array: [Spent, Remaining]
                // If Spent > Max, we render [Max, 0] but color is RED.
                let chartData = [spend > rule.max ? rule.max : spend, empty];
                
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Spent', 'Left'],
                        datasets: [{
                            data: chartData,
                            backgroundColor: [segmentColor, '#F3F4F6'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        cutout: '70%',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false }, tooltip: { enabled: false } },
                        animation: false
                    }
                });
            }

            document.getElementById('totalRebateDisp').innerText = Math.round(totalRebate).toLocaleString();
        }

        function resetData() {
            if(confirm('警告：這將會清除所有行程和記帳資料，確定嗎？')) {
                localStorage.removeItem('tokyo_plans');
                localStorage.removeItem('tokyo_expenses');
                location.reload();
            }
        }

    </script>
</body>
</html>
